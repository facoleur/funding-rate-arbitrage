services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: option_arb
      POSTGRES_PASSWORD: option_arb
      POSTGRES_DB: option_arb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U option_arb"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:option_arb@postgres:5432/option_arb
      ALEMBIC_DATABASE_URL: ""
    env_file: .env
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: uvicorn option_arb.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:option_arb@postgres:5432/option_arb
    env_file: .env
    volumes:
      - ./backend/src:/app/src
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  workers:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: watchfiles "python -m option_arb.worker" /app/src
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:option_arb@postgres:5432/option_arb
    env_file: .env
    volumes:
      - ./backend/src:/app/src
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  executor:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: watchfiles "python -m option_arb.services.executor" /app/src
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:option_arb@postgres:5432/option_arb
    env_file: .env
    volumes:
      - ./backend/src:/app/src
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    environment:
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3001:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_dev_data:
