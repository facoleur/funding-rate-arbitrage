networks:
  default:
  proxy:
    external: true

services:
  # mem_limit / logging / healthchecks / autoheal labels are defined in
  # docker-compose.yml and inherited here. Only prod-specific overrides below.
  postgres:
    environment:
      POSTGRES_USER: option_arb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: option_arb

  migrate:
    image: ghcr.io/${GHCR_OWNER}/arbitrage:${RELEASE_TAG}
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:${POSTGRES_PASSWORD}@postgres:5432/option_arb
      ALEMBIC_DATABASE_URL: postgresql://option_arb:${POSTGRES_PASSWORD}@postgres:5432/option_arb

  api:
    image: ghcr.io/${GHCR_OWNER}/arbitrage:${RELEASE_TAG}
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:${POSTGRES_PASSWORD}@postgres:5432/option_arb
    networks:
      default:
      proxy:
        aliases:
          - arbitrage-api

  workers:
    image: ghcr.io/${GHCR_OWNER}/arbitrage:${RELEASE_TAG}
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:${POSTGRES_PASSWORD}@postgres:5432/option_arb

  executor:
    image: ghcr.io/${GHCR_OWNER}/arbitrage:${RELEASE_TAG}
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:${POSTGRES_PASSWORD}@postgres:5432/option_arb

  frontend:
    image: nginx:alpine
    mem_limit: 96m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /srv/arbitrage/frontend/dist:/usr/share/nginx/html:ro
      - /srv/arbitrage/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
      proxy:
        aliases:
          - arbitrage-frontend
    restart: unless-stopped

  # Restarts any container that Docker reports as unhealthy (a hung event loop
  # never exits on its own, so `restart: unless-stopped` alone can't recover it).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      # only restarts containers labelled autoheal=true (see docker-compose.yml)
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    mem_limit: 32m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
