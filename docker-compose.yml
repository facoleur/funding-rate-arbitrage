# Cap container stdout/stderr on disk. Without this the default json-file driver
# grows unbounded and fills a small VPS in days (workers logs every 500ms).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    labels: ["autoheal=true"]
    # mem_limit values assume a ~4 GB VPS — tune to the actual box.
    # A leak then kills just this container (auto-restarted), not the whole
    # host via the kernel OOM killer.
    mem_limit: 768m
    environment:
      POSTGRES_USER: option_arb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-option_arb}
      POSTGRES_DB: option_arb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U option_arb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    logging: *default-logging
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:${POSTGRES_PASSWORD:-option_arb}@postgres:5432/option_arb
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://option_arb:${POSTGRES_PASSWORD:-option_arb}@postgres:5432/option_arb
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      DERIBIT_CLIENT_ID: ${DERIBIT_CLIENT_ID:-}
      DERIBIT_CLIENT_SECRET: ${DERIBIT_CLIENT_SECRET:-}
      DERIVE_WALLET_ADDRESS: ${DERIVE_WALLET_ADDRESS:-}
      DERIVE_SUBACCOUNT_ID: ${DERIVE_SUBACCOUNT_ID:-0}
      DERIVE_SESSION_PRIVATE_KEY: ${DERIVE_SESSION_PRIVATE_KEY:-}
      AEVO_WALLET_ADDRESS: ${AEVO_WALLET_ADDRESS:-}
      AEVO_ACCOUNT: ${AEVO_ACCOUNT:-}
      AEVO_SIGNING_KEY: ${AEVO_SIGNING_KEY:-}
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    logging: *default-logging
    labels: ["autoheal=true"]
    mem_limit: 512m
    command: uvicorn option_arb.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:${POSTGRES_PASSWORD:-option_arb}@postgres:5432/option_arb
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      DERIBIT_CLIENT_ID: ${DERIBIT_CLIENT_ID:-}
      DERIBIT_CLIENT_SECRET: ${DERIBIT_CLIENT_SECRET:-}
      DERIVE_WALLET_ADDRESS: ${DERIVE_WALLET_ADDRESS:-}
      DERIVE_SUBACCOUNT_ID: ${DERIVE_SUBACCOUNT_ID:-0}
      DERIVE_SESSION_PRIVATE_KEY: ${DERIVE_SESSION_PRIVATE_KEY:-}
      AEVO_WALLET_ADDRESS: ${AEVO_WALLET_ADDRESS:-}
      AEVO_ACCOUNT: ${AEVO_ACCOUNT:-}
      AEVO_SIGNING_KEY: ${AEVO_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  workers:
    build:
      context: ./backend
    logging: *default-logging
    labels: ["autoheal=true"]
    # heaviest process: book_cache + WS + httpx
    mem_limit: 768m
    command: python -m option_arb.worker
    healthcheck:
      # screener loop touches /tmp/hb_screener every iteration (~500ms);
      # unhealthy => event loop is hung, not just crashed.
      test: ["CMD-SHELL", "find /tmp/hb_screener -mmin -2 2>/dev/null | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:${POSTGRES_PASSWORD:-option_arb}@postgres:5432/option_arb
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      DERIBIT_CLIENT_ID: ${DERIBIT_CLIENT_ID:-}
      DERIBIT_CLIENT_SECRET: ${DERIBIT_CLIENT_SECRET:-}
      DERIVE_WALLET_ADDRESS: ${DERIVE_WALLET_ADDRESS:-}
      DERIVE_SUBACCOUNT_ID: ${DERIVE_SUBACCOUNT_ID:-0}
      DERIVE_SESSION_PRIVATE_KEY: ${DERIVE_SESSION_PRIVATE_KEY:-}
      AEVO_WALLET_ADDRESS: ${AEVO_WALLET_ADDRESS:-}
      AEVO_ACCOUNT: ${AEVO_ACCOUNT:-}
      AEVO_SIGNING_KEY: ${AEVO_SIGNING_KEY:-}
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  executor:
    build:
      context: ./backend
    logging: *default-logging
    labels: ["autoheal=true"]
    mem_limit: 512m
    command: python -m option_arb.services.executor
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/hb_executor -mmin -2 2>/dev/null | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      DATABASE_URL: postgresql+asyncpg://option_arb:${POSTGRES_PASSWORD:-option_arb}@postgres:5432/option_arb
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      DERIBIT_CLIENT_ID: ${DERIBIT_CLIENT_ID:-}
      DERIBIT_CLIENT_SECRET: ${DERIBIT_CLIENT_SECRET:-}
      DERIVE_WALLET_ADDRESS: ${DERIVE_WALLET_ADDRESS:-}
      DERIVE_SUBACCOUNT_ID: ${DERIVE_SUBACCOUNT_ID:-0}
      DERIVE_SESSION_PRIVATE_KEY: ${DERIVE_SESSION_PRIVATE_KEY:-}
      AEVO_WALLET_ADDRESS: ${AEVO_WALLET_ADDRESS:-}
      AEVO_ACCOUNT: ${AEVO_ACCOUNT:-}
      AEVO_SIGNING_KEY: ${AEVO_SIGNING_KEY:-}
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    mem_limit: 128m
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
