screener:
  poll_interval_ms: 500
  underlyings: ["BTC", "ETH"]
  exchanges: ["derive", "deribit", "deribit_linear", "aevo"]
  max_expiries_ahead: 8
  metadata_refresh_hours: 6
  book_cache_ttl_ms: 5000

thresholds:
  min_apr_pct: 0.1
  min_buy_premium_usd: 10
  min_leg_premium_liquidity_usd: 50
  max_days_to_expiry: 60    # ignorer les options > 2 mois (liquidité faible, spread peu fiable)
  min_net_profit_usd: 3.0   # profit net minimum pour couvrir les frais fixes
  min_net_return_pct: 0.3   # rendement net minimum sur le capital requis

executor:
  mode: paper
  ioc_slippage_limit_pct: 2
  poll_interval_ms: 200
  fresh_fetch_timeout_ms: 500

limits:
  max_buy_premium_per_trade_usd: 50
  max_contracts_per_trade: 1.0  # max 1 ETH ou 0.1 BTC par trade
  max_positions_open: 10
  max_daily_loss_usd: 40
  kill_switch_file: /data/EXECUTOR_DISABLED

rebalancer:
  poll_interval_sec: 300
  expiry_warning_hours: 24
  balance_low_threshold_usd: 30

exchanges:
  deribit:
    network: mainnet
    rest_rate_limit_per_sec: 20
    rest_base_url: https://www.deribit.com/api/v2
    ws_url: wss://www.deribit.com/ws/api/v2
    trade_enabled: true

  deribit_linear:
    network: mainnet
    rest_rate_limit_per_sec: 20
    rest_base_url: https://www.deribit.com/api/v2
    ws_url: wss://www.deribit.com/ws/api/v2
    trade_enabled: true

  derive:
    network: mainnet
    rest_rate_limit_per_sec: 20
    rest_base_url: https://api.lyra.finance
    ws_url: wss://api.lyra.finance/ws
    trade_enabled: true

  aevo:
    network: mainnet
    rest_rate_limit_per_sec: 10
    rest_base_url: https://api.aevo.xyz
    ws_url: wss://ws.aevo.xyz
    trade_enabled: false

perp_hedge:
  enabled: true
  rebalance_threshold_usd: 5.0
  poll_interval_sec: 60
  kill_switch_file: /data/PERP_HEDGE_DISABLED

alerts:
  telegram:
    enabled: true
    apr_threshold_pct: 10
    levels: ["info", "warn", "error"]
    opportunity_cooldown_hours: 1.0
